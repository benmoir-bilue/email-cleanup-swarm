[project]
name = "email-cleanup-swarm"
version = "0.1.0"
description = "Agentic inbox cleanup: tiered model swarm over a Gmail inbox, with human approval on every irreversible action."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth>=2.35.0",
    "textual>=0.86.0",
    "typer>=0.15.1",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.49.0"]

[project.scripts]
ecs = "ecs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
